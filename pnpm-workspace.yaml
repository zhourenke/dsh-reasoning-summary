# Host packages the install resolves from the DSH prerelease line. These entries
# only take effect when pnpm's minimumReleaseAge gate is enabled; it is not
# configured in this repository today, so the list is documentation of what the
# install needs rather than a live allowlist. Keep the versions in step with the
# DSH version the plugin targets.
#
# The window is a single baseline now (0.2.2-rc.5), so every entry carries one
# version instead of the `||` arms that a dual-baseline window needed.
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.2.2-rc.5'
  - '@deepseek-ai/dsh-brand@0.2.2-rc.5'
  - '@deepseek-ai/dsh-client-ui-plugin-manager@0.2.2-rc.5'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.2-rc.5'
  - '@deepseek-ai/dsh-error@0.2.2-rc.5'
  - '@deepseek-ai/dsh-llm@0.2.2-rc.5'
  - '@deepseek-ai/dsh-repeat-tool-reminder@0.2.2-rc.5'
  - '@deepseek-ai/dsh-scope@0.2.2-rc.5'
  - '@deepseek-ai/dsh-session@0.2.2-rc.5'
  - '@deepseek-ai/dsh-session-projection@0.2.2-rc.5'
  - '@deepseek-ai/dsh-system-prompt@0.2.2-rc.5'
  - '@deepseek-ai/dsh-timeout@0.2.2-rc.5'
  - '@deepseek-ai/dsh-tools@0.2.2-rc.5'
  - '@deepseek-ai/dsh-typert-protocol@0.2.2-rc.5'
  - '@deepseek-ai/dsh-user-approval@0.2.2-rc.5'
  - '@deepseek-ai/dsh-util-crypto@0.2.2-rc.5'
  - '@deepseek-ai/dsh-util-values@0.2.2-rc.5'
